<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performer</title>
    <style>
        body { font-family: sans-serif; padding: 1em; background-color: #000000; color: #ffffff; }
        canvas { border: 1px solid #ffffff; }
        #log { background-color: #000000; color: #ffffff; border: 1px solid #ffffff; }
    </style>
</head>
<body>
    <h1>Performer</h1>
    <div id="status">Connecting to server...</div>
    <div>
        <label for="partialSelector">Select Your Part (Harmonic):</label>
        <select id="partialSelector" disabled></select>
    </div>
    <div>
        <label for="micGain">Mic Gain:</label>
        <input type="range" id="micGain" min="1" max="10" value="5" step="0.5">
        <span id="gainValue">5.0</span>
    </div>
    <button id="micButton">Enable Mic</button>
    <button id="toggle" disabled>Start/Stop</button>
    <br><br>
    <div id="canvas-container" style="display: flex; gap: 10px;">
        <canvas id="live-visualizer" width="400" height="300"></canvas>
        <canvas id="score-visualizer" width="800" height="300"></canvas>
    </div>
    <h3>Log</h3>
    <pre id="log" style="height: 150px; overflow-y: scroll; border: 1px solid #ffffff; padding: 5px;"></pre>

    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
