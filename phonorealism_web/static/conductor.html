<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Conduct — Phonorealism</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0d10'/><path d='M3 21 Q9 5 16 16 T29 11' stroke='%234da3ff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M3 26 Q11 22 16 26 T29 24' stroke='%23ffb648' stroke-width='2' fill='none' stroke-linecap='round'/></svg>" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <div class="bar">
      <div>
        <div class="title">Conductor</div>
        <div class="subtitle" id="scoreName">no score loaded</div>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="connPill"><i class="dot"></i><span>hub</span></span>
    </div>

    <main class="scroll pad">
      <div id="insecureNote" class="note hidden"></div>

      <div class="card">
        <h2>Score</h2>
        <div class="row wrap">
          <button id="loadBtn" class="primary">Load score…</button>
          <input type="file" id="fileInput" accept=".sav,.csv" class="hidden" />
          <span class="hint" id="scoreInfo">justidraw .sav or phonorealizer CSV</span>
        </div>
        <div id="scoreErr" class="warn hidden" style="margin-top: 12px"></div>
        <label class="field" style="margin-top: 14px">
          <span>justidraw amplitude response</span>
          <select id="ampCurve">
            <option value="linear">As notated (w = amplitude)</option>
            <option value="justidraw">As justidraw sounds it (w²)</option>
          </select>
        </label>
      </div>

      <div class="card">
        <h2>Join</h2>
        <div class="row wrap" style="align-items: flex-start; gap: 18px">
          <div class="qr" id="qrBox"></div>
          <div>
            <div class="url" id="joinUrl">…</div>
            <div class="hint" style="margin-top: 8px" id="joinHint"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Parts</h2>
        <div class="hint" style="margin-bottom: 10px">
          By default every partial is its own part, numbered from the lowest.
          Group them to make named parts for real players.
        </div>
        <div class="row wrap" style="margin-bottom: 10px">
          <button class="sm" id="autoParts">Reset to one per partial</button>
          <button class="sm" id="addPart">New named part…</button>
          <button class="sm" id="exportParts">Export part map</button>
          <button class="sm" id="importParts">Import engraving / part map</button>
          <input type="file" id="partsFile" accept=".json" class="hidden" />
        </div>
        <div class="hint" id="partsStatus"></div>
        <div id="partEditor" class="list"></div>
      </div>

      <div class="card">
        <h2>Ensemble</h2>
        <div id="players" class="players">
          <div class="hint">Nobody has joined yet.</div>
        </div>
      </div>

      <div class="card">
        <h2>Transport</h2>
        <label class="field">
          <span id="leadLabel">Lead-in — 2.5 s</span>
          <input type="range" id="leadIn" min="0.5" max="10" step="0.5" value="2.5" />
        </label>
        <div class="row">
          <button id="startBtn" class="go" style="flex: 2" disabled>Start</button>
          <button id="stopBtn" class="danger" style="flex: 1">Stop</button>
        </div>
        <div class="hint" style="margin-top: 10px" id="readyHint"></div>
      </div>
    </main>

    <script type="module" src="/static/js/conductor.js"></script>
  </body>
</html>
